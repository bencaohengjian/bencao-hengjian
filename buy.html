<!DOCTYPE html>


<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>本草衡鉴 · 开通购买</title>
<style>
:root{--bg:#0d1512;--panel:#131f1a;--line:#2a3a32;--gold:#c8a03c;--txt:#e8e2d2;--dim:#9aa79f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Songti SC","Noto Serif SC",serif;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:26px;margin:6px 0 2px;letter-spacing:2px}
.sub{color:var(--dim);font-size:13px;margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.label{font-size:13px;color:var(--dim);margin-bottom:8px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;position:relative;background:#0f1a16}
.plan.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.plan b{display:block;font-size:17px;color:var(--txt)}
.plan .price{color:var(--gold);font-size:22px;margin-top:6px}
.plan .note{font-size:12px;color:var(--dim);margin-top:2px}
.subjs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.subj{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer;color:var(--dim);background:#0f1a16}
.subj.on{border-color:var(--gold);color:var(--gold)}
.pays{display:flex;gap:10px;margin-top:8px}
.pay{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-size:14px;color:var(--dim)}
.pay.on{border-color:var(--gold);color:var(--gold)}
button.primary{width:100%;margin-top:14px;background:var(--gold);color:#17211d;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:600;cursor:pointer}
button.primary:disabled{opacity:.5}
.hint{font-size:12px;color:var(--dim);margin-top:10px}
#payBox{display:none;text-align:center}
#payBox.on{display:block}
#qr{width:200px;height:200px;margin:10px auto;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#666;font-size:12px;text-align:center;padding:10px}
a.paylink{display:inline-block;margin-top:6px;color:var(--gold);font-size:14px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:19px;letter-spacing:1px;color:var(--gold);word-break:break-all;background:#0b1411;border:1px dashed var(--gold);border-radius:10px;padding:12px;margin-top:10px}
.ok{color:#6fcf97}
.warn{color:#e0b050}
.foot{text-align:center;color:var(--dim);font-size:12px;margin-top:18px}
.foot a{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <h1>本草衡鉴</h1>
  <p class="sub">本科六科题库 · 知识卡 · 扫码付款，确认后自动出码</p>

  <div class="card">
    <div class="label">选择套餐</div>
    <div class="plans">
      <div class="plan on" data-kind="single"><b>单科</b><div class="price">¥9.9</div><div class="note">任选一科，开通即用</div></div>
      <div class="plan" data-kind="all"><b>全科</b><div class="price">¥29.9</div><div class="note">本科六科全部解锁</div></div>
    </div>
    <div class="subjs" id="subjBox">
      <div class="subj on" data-sub="Y">中药药理学</div>
      <div class="subj" data-sub="P">中药炮制学</div>
      <div class="subj" data-sub="J">中药鉴定学</div>
      <div class="subj" data-sub="Z">药用植物学</div>
    </div>
  </div>

  <div class="card">
    <div class="label">支付方式</div>
    <div class="pays">
      <div class="pay on" data-pay="wxpay">微信支付</div>
      <div class="pay" data-pay="alipay">支付宝</div>
    </div>
    <button class="primary" id="createBtn">生成付款码 · ¥9.9</button>
    <p class="hint">解剖生理、中药化学单科码暂请联系客服开通；全科套餐已包含这两科。考研 703 支持单科开通：中药学、中药药理学、分析化学，单科码联系客服获取。</p>
    <p class="hint" id="mockHint"></p>
  </div>

  <div class="card" id="payBox">
    <div class="label" id="payTitle">等待付款</div>
    <div id="qr">付款码加载中…</div>
    <a class="paylink" id="payLink" target="_blank" rel="noopener" hidden>打不开二维码？点这里打开支付页</a>
    <p class="hint" id="payHint">付款完成后，本页会自动显示开通码。</p>
    <div class="code" id="codeBox" hidden></div>
    <button class="primary" id="copyBtn" hidden>复制开通码</button>
  </div>

  <p class="foot"><a href="/">返回刷题首页</a> · 开通码一单一份，请勿转发</p>
</div>

<script>
// 部署云函数后把这里改成函数 HTTP 地址；留空表示同域 /api
var API_BASE = 'https://bottom-cougar-d0gbb0pyuf50e428f-1536516331.ap-shanghai.app.tcloudbase.com/api';
var QR_LOCAL = { wxpay:'./收款码_wx.png', alipay:'./收款码_al.png' };
var state = { kind: 'single', subject: 'Y', pay: 'wxpay', orderNo: '', timer: null, mock: false };

function $(s){ return document.querySelector(s) }
function api(action, data){
  var url = (API_BASE || '') + (API_BASE ? '' : '/api');
  var sep = url.indexOf('?') >= 0 ? '&' : '?';
  return fetch(url + sep + 'action=' + action, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(Object.assign({ action: action }, data || {}))
  }).then(function(r){ return r.json() })
}

function price(){ return state.kind === 'all' ? 29.9 : 9.9 }
function refreshBtn(){
  $('#createBtn').textContent = '生成付款码 · ¥' + price().toFixed(1)
  $('#subjBox').style.display = state.kind === 'all' ? 'none' : 'grid'
}
Array.prototype.forEach.call(document.querySelectorAll('.plan'), function(el){
  el.onclick = function(){
    document.querySelectorAll('.plan').forEach(function(x){ x.classList.remove('on') })
    el.classList.add('on'); state.kind = el.dataset.kind; refreshBtn()
  }
})
Array.prototype.forEach.call(document.querySelectorAll('.subj'), function(el){
  el.onclick = function(){
    document.querySelectorAll('.subj').forEach(function(x){ x.classList.remove('on') })
    el.classList.add('on'); state.subject = el.dataset.sub
  }
})
Array.prototype.forEach.call(document.querySelectorAll('.pay'), function(el){
  el.onclick = function(){
    document.querySelectorAll('.pay').forEach(function(x){ x.classList.remove('on') })
    el.classList.add('on'); state.pay = el.dataset.pay
    if (state.orderNo && $('#payBox').classList.contains('on') && QR_LOCAL[state.pay]) {
      $('#qr').innerHTML = '<img src="'+QR_LOCAL[state.pay]+'" style="width:190px;height:190px;object-fit:contain">'
    }
  }
})

$('#createBtn').onclick = function(){
  var btn = this; btn.disabled = true; btn.textContent = '正在创建订单…'
  api('create', { kind: state.kind, subject: state.subject, provider: state.pay }).then(function(d){
    btn.disabled = false; refreshBtn()
    if (!d.ok) { alert(d.msg || '创建订单失败'); return }
    state.orderNo = d.orderNo
    $('#payBox').classList.add('on')
    $('#payTitle').textContent = (state.kind === 'all' ? '全科套餐' : '单科套餐') + ' · ¥' + d.amount.toFixed(1)
    if (d.manual) {
      var qsrc = d.qrImage || QR_LOCAL[state.pay]
      $('#qr').innerHTML = qsrc ? '<img src="'+qsrc+'" style="width:190px;height:190px;object-fit:contain">' : '请向客服索取收款码'
      $('#payHint').textContent = '请按 ¥' + d.amount.toFixed(1) + ' 付款，备注订单尾号 ' + d.orderNo.slice(-6) + '，到账确认后本页自动出码。'
      $('#mockHint').textContent = '当前为人工确认通道。'
      $('#payLink').style.display = 'none'
      poll(); return
    }
    if (d.code) {
      state.mock = true
      showCode(d.code)
      $('#qr').textContent = '模拟支付成功'
      $('#mockHint').textContent = '当前是模拟通道，未真实收款。'
      return
    }
    $('#qr').innerHTML = '请用' + (state.pay === 'alipay' ? '支付宝' : '微信') + '扫码支付<br>支付页会在新窗口打开'
    $('#payLink').href = d.payUrl; $('#payLink').style.display = 'inline-block'
    window.open(d.payUrl, '_blank')
    poll()
  }).catch(function(e){ btn.disabled = false; refreshBtn(); alert('网络错误：' + e.message) })
}

function poll(){
  clearTimeout(state.timer)
  state.timer = setTimeout(function(){
    api('query', { orderNo: state.orderNo }).then(function(d){
      if (d.ok && d.status === 'paid' && d.code) { showCode(d.code); return }
      $('#payHint').textContent = '尚未收到付款通知，付款后请稍等几秒…'
      poll()
    }).catch(function(){ poll() })
  }, 2000)
}

function showCode(code){
  $('#qr').textContent = '支付成功'
  $('#payHint').textContent = '开通码已生成，复制后到「我的」页粘贴开通。'
  $('#codeBox').textContent = code; $('#codeBox').hidden = false
  $('#copyBtn').hidden = false
  $('#payLink').style.display = 'none'
}

$('#copyBtn').onclick = function(){
  var t = $('#codeBox').textContent
  navigator.clipboard && navigator.clipboard.writeText(t).then(function(){
    $('#copyBtn').textContent = '已复制'
  }).catch(function(){ prompt('手动复制', t) })
}
refreshBtn()

// 从支付页跳回时自动取码
;(function(){
  var q = new URLSearchParams(location.search)
  var no = q.get('order')
  if (!no) return
  state.orderNo = no
  $('#payBox').classList.add('on')
  $('#payTitle').textContent = '订单 ' + no
  $('#qr').textContent = '正在查询支付结果…'
  api('query', { orderNo: no }).then(function(d){
    if (d.ok && d.status === 'paid' && d.code) { showCode(d.code); return }
    poll()
  }).catch(function(){ poll() })
})()
</script>
</body>
</html>
